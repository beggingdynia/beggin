            overflow: hidden;
        }

        /* Wspólny styl dla niewidzialnych stref klikania */

        .them-spot { left: 4%; width: 42%; height: 6%; }

        /* Wiersze dopasowane do ikon na drugim plakacie */
        #them-glukoza { top: 52%; }
        #them-spadek { top: 60%; }
        #them-bialko { top: 68%; }
        #them-odzywcze { top: 76%; }

        #us-energia { top: 52%; }

        #us-b12 { top: 76%; }
        #us-odzywcze { top: 84%; }


        /* --- STYLIZACJA POPUPÓW (Tooltips) --- */
        .custom-tooltip {
            position: absolute;
            background: rgba(255, 255, 255, 0.98);
            color: #500613;
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease, transform 0.2s ease;
            transform: translateY(10px);
            z-index: 10;
            max-width: 290px;
            text-align: center;
            line-height: 1.4;
            box-sizing: border-box;
        }

        .custom-tooltip.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* Specjalna klasa zwiększająca szerokość dymka tylko dla logo */
        .custom-tooltip.logo-style {
            max-width: 320px;
            width: 85%;
        }

        .tooltip-title {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            text-transform: uppercase;
            font-size: 13px;
            border-bottom: 1px solid rgba(80, 6, 19, 0.2);
            padding-bottom: 4px;
        }

        /* Miniaturka mapy/witryny w tooltipie */
        .tooltip-img {
            width: 100%;
            height: auto;
            border-radius: 4px;
            margin-top: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            display: block;
        }

        /* Stylizacja dla interaktywnego baneru na dole */
        .bottom-banner-container {
            position: relative;
            max-width: 800px;
            width: 100%;
            margin: 40px auto 20px auto;

        .banner-hotspot {

            left: 20%;

            height: 13%;

            border-radius: 10px;
            transition: background 0.2s ease;
        }
        .banner-hotspot:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        #banner-wolt {
            top: 60%;
        }
        #banner-pyszne {
            top: 73%;
        }
    </style>

    <script>
        const hotspots = document.querySelectorAll('.hotspot');
        const tooltip = document.getElementById('tooltip');

        const atutyJajek = [
    "<span class='tooltip-title'>Jajko to wsparcie mózgu i układu nerwowego</span>Cholina z żółtka produkuje acetylocholinę — kluczowy neuroprzekaźnik. Poprawia pamięć, koncentrację i funkcje poznawcze, zmniejsza ryzyko demencji i choroby Alzheimera.",
    "<span class='tooltip-title'>Jajko to wsparcie wątroby i układu pokarmowego</span>Żółtka są najlepszym źródłem fosfolipidów w diecie (3× więcej niż wątróbka). Cholina wspiera zapobieganie niealkoholowemu stłuszczeniu wątroby, a lecytyna — kamicom żółciowych.",
    "<span class='tooltip-title'>Jajko to wzorcowe białko budulcowe</span>WHO uznała białko jajka za standard oceny wartości odżywczej innych białek — zawiera wszystkie aminokwasy egzogenne. Przyswajalność sięga 95%. Jedno jajko pokrywa ok. 25% dziennego zapotrzebowania dorosłego na białko.",
    "<span class='tooltip-title'>Jajko to sojusznik odchudzania</span>Jedno jajko (ok. 56 g) to zaledwie ~80 kcal, a jednocześnie jeden z najbardziej sycących pokarmów. Regularne spożywanie jajek może dawać lepszy efekt redukcji masy ciała niż samo ograniczanie kalorii — dzięki regulacji metabolizmu energetycznego przez fosfolipidy (kardiolipidy).",
    "<span class='tooltip-title'>Jajko chroni serce i naczynia krwionośne</span>Wbrew dawnym obawom jajka nie powodują miażdżycy, a wręcz mogą jej zapobiegać. Nienasycone kwasy tłuszczowe omega-3 obniżają poziom LDL i podnoszą HDL. Badania na pół miliona ludzi wskazują, że jedno jajko dziennie może zmniejszać ryzyko zawału i udaru.",
    "<span class='tooltip-title'>Jajko chroni oczy i poprawia widzenie</span>Luteina i zeaksantyna z żółtka to potężne antyoksydanty filtrujące szkodliwe promieniowanie UVA i UVB. Chronią siatkówkę, zapobiegają zwyrodnieniu plamki żółtej (AMD) i zmniejszają ryzyko zaćmy.",
    "<span class='tooltip-title'>Jajko to naturalne źródło lizozymu</span>Lizozym zawarty w białku działa jak naturalny antybiotyk — niszczy ściany komórkowe bakterii. Jest tak skuteczny, że przemysł farmaceutyczny, kosmetyczny i mleczarski pozyskuje go z jajek na skalę przemysłową.",
    "<span class='tooltip-title'>Jajko hamuje stany zapalne dzięki cystatynie</span>Cystatyna z białka blokuje enzymy cysteinowe w zainfekowanych komórkach. Ogranicza rozwój chorób zapalnych: zapalenia stawów, chorób skórnych, paradontozy. Hamuje też tworzenie płytek amyloidowych w mózgu, co wiązane jest z ochroną przed chorobą Alzheimera.",
    "<span class='tooltip-title'>Jajko chroni zęby przed próchnicą</span>Immunoglobuliny Y z żółtka zwalczają bakterię Streptococcus mutans — głównego sprawcę próchnicy. To unikalne białka odpornościowe rozpoznające i neutralizujące patogeny atakujące szkliwo zębów.",
    "<span class='tooltip-title'>Jajko wzmacnia kości i zęby</span>Witamina D z żółtka warunkuje wchłanianie wapnia — bez niej mineralizacja kości jest niemożliwa. Jajka to jedno z nielicznych naturalnych źródeł witaminy D w diecie, zapobiegają osteoporozie i krzywicy. Zawartość witaminy D jest wyższa u kur z wolnego wybiegu.",
    "<span class='tooltip-title'>Jajko chroni przed anemią</span>Zawierają żelazo w łatwo przyswajalnej formie — niezbędne do produkcji hemoglobiny transportującej tlen do każdej komórki ciała. Miedź i cynk wspierają tworzenie krwinek i sprawne funkcjonowanie układu immunologicznego.",
    "<span class='tooltip-title'>Jajko to kluczowy pokarm w ciąży i dla dzieci</span>Cholina jest niezbędna do prawidłowego rozwoju mózgu płodu i niemowlęcia. Badania pokazują, że dzieci, które dostawały jedno jajko dziennie przez 6 miesięcy, osiągały lepszy wzrost i masę ciała.",
    "<span class='tooltip-title'>Jajko odżywia skórę, włosy i paznokcie</span>Biotyna, witamina A, E i siarka z aminokwasów budują keratynę — białko włosów i paznokci. Selen działa jako antyoksydant spowalniający starzenie skóry, lecytyna nawilża i uelastycznia, a witamina A reguluje regenerację naskórka.",
    "<span class='tooltip-title'>Jajko stabilizuje poziom cukru we krwi</span>Zerowy indeks glikemiczny — nie powoduje skoków insuliny i utrzymuje stałą energię. Białko i tłuszcz spowalniają wchłanianie glukozy z innych składników posiłku, co czyni jajka bezpiecznym wyborem dla diabetyków i osób z insulinoopornością.",
    "<span class='tooltip-title'>Jajko to jeden z najbardziej kompletnych pokarmów natury</span>Zawiera niemal wszystkie witaminy (A, D, E, K, B1–B12) i pełen zestaw minerałów — fosfor, potas, sód, wapń, żelazo, magnez, miedź, cynk, selen, jod. Brakuje tylko witaminy C. Dlatego bywa nazywane najdoskonalszym tworem natury."
];

        hotspots.forEach(hotspot => {
            
            function showTooltip(e) {
                const currentWrapper = hotspot.closest('.interactive-poster-wrapper');
                currentWrapper.appendChild(tooltip);

                let text = "";
                
                if (hotspot.id === 'spot-jajko-zdrowe') {
                    const randomIndex = Math.floor(Math.random() * atutyJajek.length);
                    text = atutyJajek[randomIndex];
                } else {
                    text = hotspot.getAttribute('data-text');
                }

                tooltip.innerHTML = text;

                // Reset klas specjalnych
                tooltip.className = 'custom-tooltip';

                // Pobieramy pozycję kursora/dotknięcia względem kontenera plakatu
                const rect = currentWrapper.getBoundingClientRect();
                let clientX = e.clientX || (e.touches && e.touches[0].clientX);
                let clientY = e.clientY || (e.touches && e.touches[0].clientY);

                let posX = clientX - rect.left;
                let posY = clientY - rect.top;

                // --- INTELIGENTNE POZYCJONOWANIE DLA LOGO BEGGIN ---
                if (hotspot.id === 'spot-logo') {
                    tooltip.classList.add('logo-style'); // Powiększenie okienka dla ładniejszego wyglądu zdjęcia
                    tooltip.classList.add('active');
                    
                    // Umieść dymek POD logiem (zamiast nad nim), żeby nie uciekał za ekran
                    tooltip.style.left = `${posX - tooltip.offsetWidth / 2}px`;
                    tooltip.style.top = `${posY + 25}px`; 
                } else {
                    // Dla wszystkich pozostałych przycisków standardowo: wyświetl NAD miejscem kliknięcia
                    tooltip.classList.add('active');
                    tooltip.style.left = `${posX - tooltip.offsetWidth / 2}px`;
                    tooltip.style.top = `${posY - tooltip.offsetHeight - 15}px`;
                }
            }

            function hideTooltip() {
                tooltip.classList.remove('active');
            }

            hotspot.addEventListener('mouseenter', showTooltip);
            hotspot.addEventListener('mouseleave', hideTooltip);

            hotspot.addEventListener('touchstart', function(e) {
                e.preventDefault(); 
                showTooltip(e);
            });
        });

        document.addEventListener('touchstart', function(e) {
            if (!e.target.classList.contains('hotspot')) {
                tooltip.classList.remove('active');
            }
        });
    </script>
